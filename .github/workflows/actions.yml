name: test-lint-build-deploy

on:
  push:
    branches:
      - master
      - develop
    paths-ignore:
      - 'README.md'
      - '**.txt'
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:
    inputs:
      target-branch:
        description: 'Branch to deploy (e.g., feature-x)'
        required: true
        type: string

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/jhonquirama/config
      REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
      RESTPORT: 8080
      ECR_REGISTRY: ${{ secrets.ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      APP_NAME: "my-portfolio-ms"

    steps:
      - name: Configure Git
        run: git config --global url.https://${{ env.REPO_TOKEN }}@github.com/jhonquirama/.insteadOf https://github.com/jhonquirama/

      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.1'

      - name: Build
        run: make build

      - name: Lint
        run: |
          export GO111MODULE=off
          make lint

      - name: Unit tests
        run: |
          go test -tags musl ./internal/... -coverprofile coverage.out -covermode count
          go tool cover -func coverage.out

      - name: Quality Gate
        run: make coverage

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker image
        id: docker_push
        run: |
          RAW_TAG=${{ github.event.inputs.target-branch || github.ref_name }}
          TAG=$(echo "$RAW_TAG" | tr '/' '-' | cut -c 1-30)
          echo "Normalized tag: $TAG"
          
          docker build -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$TAG .
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$TAG
          
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "IMAGE=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$TAG" >> $GITHUB_ENV

      - name: Checkout Infra Repo
        if: success()
        uses: actions/checkout@v4
        with:
          repository: jhonquirama/infra-core
          token: ${{ secrets.INFRA_REPO_TOKEN }}  # Asegúrate que este secret existe
          path: infra-core
          fetch-depth: 0  # Opcional: clona todo el historial

      - name: Update Helm Chart
        if: success()
        env:
          GIT_AUTHOR_NAME: "GitHub Actions"
          GIT_COMMITTER_NAME: "GitHub Actions"
          GIT_AUTHOR_EMAIL: "actions@github.com"
          GIT_COMMITTER_EMAIL: "actions@github.com"
        run: |
          echo "=== Starting Helm Chart Update ==="
          echo "Using tag: ${{ env.TAG }}"
          echo "Image: ${{ env.IMAGE }}"
          
          # Navegar al directorio del repo infra-core
          cd infra-core
          
          # Crear directorio si no existe
          mkdir -p kubernetes/${{ env.APP_NAME }}
          
          # Generar el values.yaml CORRECTAMENTE
          echo "Generating values.yaml..."
          cat > kubernetes/${{ env.APP_NAME }}/values.yaml <<'EOL'
          repository: ${IMAGE%%:*}
          tag: "${{ env.TAG }}"
          EOL
          
          # Configuración global de Git
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global push.default simple
          
          # Verificar cambios
          
          # Verificar cambios
          echo "Checking for changes..."
          git status
          
          if [ -n "$(git status --porcelain)" ]; then
          echo "Changes detected. Committing..."
          git add .
          git commit -m "Deploy ${{ env.TAG }} [ci skip]"
        
          echo "Pulling latest changes..."
          git pull --rebase origin main
        
          echo "Pushing changes..."
          git push origin HEAD:main
          echo "Changes pushed successfully!"
          else
          echo "No changes to commit."
          fi

          echo "=== Helm Chart Update Complete ==="

      - name: Debug Infra Core
        run: |
          cd infra-core
          echo "--- Current values.yaml ---"
          cat kubernetes/${{ env.APP_NAME }}/values.yaml
          echo "--- Git Status ---"
          git status
          echo "--- Git Remotes ---"
          git remote -v
