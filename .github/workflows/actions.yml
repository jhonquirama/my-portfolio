name: test-lint-build-deploy

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:
    inputs:
      target-branch:
        description: 'Rama a desplegar (ej: feature-x)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/jhonquirama/config
      REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
      RESTPORT: 8080
      ECR_REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}  # Nuevo secreto requerido
      AWS_REGION: us-east-1

    steps:
      - run: git config --global url.https://$REPO_TOKEN@github.com/jhonquirama/.insteadOf https://github.com/jhonquirama/
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.1'

      - name: Build
        run: |
          make build

      - name: Lint
        run: |
          export GO111MODULE=off
          make lint

      - name: Unit tests
        run: |
          go test -tags musl ./internal/... -coverprofile coverage.out -covermode count
          go tool cover -func coverage.out

      - name: Quality Gate - Test coverage
        run: |
          make coverage

      # Nuevos pasos añadidos ============================== - name: Login to ECR
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Docker Image
        run: |
          TAG=${{ github.event.inputs.target-branch || github.ref_name }}
          docker build -t $ECR_REGISTRY/$APP_NAME:$TAG .
          docker push $ECR_REGISTRY/$APP_NAME:$TAG

      - name: Update Helm Chart in Infra Repo
        env:
          INFRA_REPO_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          git clone https://$INFRA_REPO_TOKEN@github.com/jhonquirama/infra-core.git
          cd infra-core
          echo "image.tag: \"$TAG\"" > kubernetes/my-ms/values.yaml
          git config user.email "github-actions@example.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Deploy $TAG"
          git push

