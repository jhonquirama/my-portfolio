name: GO WORKFLOWS
'on':
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
permissions:
  contents: read
  pull-requests: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          comment-summary-in-pr: always
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -v ./...
