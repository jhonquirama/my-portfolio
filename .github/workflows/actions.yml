name: test-lint-build-deploy

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:
    inputs:
      target-branch:
        description: 'Branch to deploy (e.g., feature-x)'
        required: true
        type: string

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/jhonquirama/config
      REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
      RESTPORT: 8080
      ECR_REGISTRY: ${{ secrets.ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      APP_NAME: "blt-msa-ha-checkout-bookings-broker"  # Nombre de tu app

    steps:
      # Configuración inicial de Git y Go
      - run: git config --global url.https://$REPO_TOKEN@github.com/jhonquirama/.insteadOf https://github.com/jhonquirama/
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.1'

      # Build, tests y linting
      - name: Build
        run: make build

      - name: Lint
        run: |
          export GO111MODULE=off
          make lint

      - name: Unit tests
        run: |
          go test -tags musl ./internal/... -coverprofile coverage.out -covermode count
          go tool cover -func coverage.out

      - name: Quality Gate - Test coverage
        run: make coverage

      # Autenticación en AWS ECR
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4  # Versión más reciente
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Construir y subir imagen Docker
      - name: Build and Push Docker image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          # Normaliza el tag
          RAW_TAG=${{ github.event.inputs.target-branch || github.ref_name }}
          TAG=$(echo "$RAW_TAG" | tr '/' '-')
          
          # Build y push
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$TAG
          
          # Guarda el tag normalizado para pasos posteriores
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Update Helm Chart
        run: |
          echo "Using tag: ${{ env.TAG }}"  # Accede al tag normalizado
          # ... (resto del código para actualizar Helm)
          - name: Checkout Infra Repo
            uses: actions/checkout@v4
            with:
              repository: jhonquirama/infra-core
              token: ${{ secrets.INFRA_REPO_TOKEN }}
              path: infra-core

          # Actualizar el values.yaml
          echo "image:
            repository: $ECR_REGISTRY/$ECR_REPOSITORY
            tag: \"$TAG\"" > infra-core/kubernetes/$APP_NAME/values.yaml

          # Commit y push
          cd infra-core
          git config user.email "quirama80@gmail.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Deploy $TAG for $APP_NAME"
          git push
      # ----------- Docker Hub (Opcional - Comentado) -----------
